name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require michael/ branch prefix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != michael/* ]]; then
            echo "Pull request branches must start with michael/"
            echo "Found: $HEAD_REF"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@03f1aad4c6c7ffd436567f42f9384779290529bd # v4

      - uses: astral-sh/setup-uv@7474bc4690e29a8392af63c5b98e7449536d5c3a # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --locked
      - run: bash scripts/ci-check.sh lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@03f1aad4c6c7ffd436567f42f9384779290529bd # v4

      - uses: astral-sh/setup-uv@7474bc4690e29a8392af63c5b98e7449536d5c3a # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --locked
      - run: bash scripts/ci-check.sh test
